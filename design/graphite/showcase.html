<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stultus — дизайн Graphite</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e2;color:#252b23;font:13px 'Segoe UI',Arial,sans-serif}header{max-width:1400px;margin:auto;padding:32px 40px 22px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font:10px Consolas,monospace;letter-spacing:2px;color:#68715f;margin-bottom:9px}h1{font-weight:400;font-size:32px;letter-spacing:-1.3px;margin:0}h1 span{color:#7d8675}header p{font-size:12px;color:#727b6b;max-width:280px;margin:0}.controls{max-width:1400px;margin:auto;padding:0 40px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls label{font-size:11px;color:#717a68;margin-right:5px}.controls select,.controls button{font:11px 'Segoe UI',sans-serif;border:1px solid #ccd0c4;background:transparent;color:#4a5343;border-radius:6px;padding:8px 12px;cursor:pointer}.controls button[aria-pressed=true]{background:#283023;color:#e8eee0;border-color:#283023}.controls select{margin-left:auto;font-size:12px;padding-right:20px}.stage{padding:0 28px 32px;display:flex;justify-content:center}iframe{display:block;background:#191b1a;width:1200px;max-width:100%;height:850px;border:1px solid #343c2d;border-radius:13px;box-shadow:0 24px 60px #1d251e24;transition:width .35s}footer{max-width:1280px;margin:auto;padding:0 40px 26px;display:flex;gap:18px;justify-content:space-between;font:10px Consolas,monospace;color:#757e6c}a{color:inherit}button:focus-visible,select:focus-visible{outline:2px solid #4f692e;outline-offset:3px}@media(max-width:650px){header{padding:24px 18px 20px}header p{display:none}.controls{padding:0 18px 20px}.controls select{margin-left:0;width:100%;margin-top:8px}.stage{padding:0 8px 24px}iframe{height:760px;border-radius:9px}h1{font-size:28px}footer{padding:0 18px 24px;flex-wrap:wrap}.controls label{display:none}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style></head><body><header><div><div class="eyebrow">STULTUS / DESIGN STUDY 01</div><h1>Место для <span>вашей идеи.</span></h1></div><p>Graphite · спокойный рабочий интерфейс<br>для архитектуры в SketchUp</p></header><div class="controls"><label>ОКНО</label><button data-width="380" aria-pressed="false">380 · панель</button><button data-width="700" aria-pressed="false">700 · обычное</button><button data-width="1200" aria-pressed="true">1200 · широкое</button><select id="state" aria-label="Состояние интерфейса"><option value="conversation">Разговор и результат</option><option value="empty">Пустое окно</option><option value="busy">Модель работает</option><option value="ask">Вопрос модели</option><option value="shot">Разрешение на снимок</option><option value="error">Ошибка инструмента</option><option value="disconnected">Нет связи</option><option value="connecting">Подключение</option><option value="settings">Настройки</option></select></div><div class="stage"><iframe id="preview" src="preview.html" title="Интерактивный макет Stultus"></iframe></div><footer><span>GRAPHITE / 01 &nbsp; · &nbsp; OFFLINE PROTOTYPE</span><span>Демонстрационные сцена и ответы · <a href="preview.html" target="_blank">Открыть в отдельном окне ↗</a></span></footer><script>const frame=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.getElementById('state').onchange=e=>{frame.src='preview.html?state='+encodeURIComponent(e.target.value)};</script></body></html>
